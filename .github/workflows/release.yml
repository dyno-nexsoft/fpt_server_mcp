name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dyno-nexsoft/fpt_server_shared
          path: ../fpt_server_shared
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test
      - run: dart compile exe bin/fpt_server_mcp.dart -o fpt_server_mcp
      - uses: softprops/action-gh-release@v2
        with:
          files: fpt_server_mcp
